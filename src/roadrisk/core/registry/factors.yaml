# Factor registry
#
# A factor is a declaration, not code. Adding one here is the only step required to
# make it available to both modes. The engine reads this file and builds the model
# specification from it.
#
# ---------------------------------------------------------------------------------
# ON WEIGHTS
#
# A factor may carry several published weights, each declaring the context it is
# valid in: `family`, `facility_type`, `region`, `severity`, `scope`. The engine picks
# the best match for the run, reports what it had to reach for, and scores agreement
# where two sources genuinely overlap. It never averages them.
#
# Weights are COMPUTED, not chosen. Run
#
#     python tools/derive_weights.py            # report
#     python tools/derive_weights.py --yaml     # registry-ready fragments
#
# to regenerate every one from its published equation. Full working, each equation
# verbatim and every assumption named, in docs/WEIGHTS.md. A test fails if this file
# drifts from the script.
#
# `source` is mandatory on every weight — an uncited weight cannot exist. A factor
# with no weights simply does not enter Mode B; it is never silently weighted zero,
# and the report names it.
#
# `caveat` is a limitation intrinsic to a weight, true on every run. It always
# surfaces as a concern. That is how a known-imperfect weight stays usable without
# becoming quietly trusted.
#
# ---------------------------------------------------------------------------------
# ON expected_sign
#
# The guard rail. A fitted coefficient that contradicts its declared sign is flagged
# prominently and never quietly reported. Signs here are derived from mechanism, not
# from a fit, so they are defensible independently of any dataset. Every weight is
# validated against them at load time.
# ---------------------------------------------------------------------------------
#
# DELIBERATELY ABSENT: rainfall and other weather terms. Withdrawn from the M51 model
# as a season artefact. A variable that correlates with an omitted seasonal cycle is
# not measuring what its name claims. It returns only alongside an explicit seasonal
# control.
# ---------------------------------------------------------------------------------
#
# drop_priority: lower is shed first when the ladder must reduce the specification.
# Values are unique so descent is deterministic.

version: "0.2.0"

factors:
  - name: traffic_proxy
    label: Traffic proxy (graph centrality)
    column: traffic_proxy
    transform: ln1p
    expected_sign: "+"
    drop_priority: 100
    missing_behaviour: >
      Exposure reverts to length x duration alone. The model can no longer separate
      "busy" from "long", and every other coefficient absorbs some volume signal.
      The single most damaging absence in the registry.
    notes: >
      NEVER relabel this as `aadt`. No global open AADT source exists. This is a
      relative ranking quantity built from road class, population accessibility,
      graph centrality and night lights.
      UNCITED, and probably permanently so: this is our own construct, and no
      published weight exists for graph centrality. The HSM AADT exponent does not
      transfer precisely because this is not AADT.
    adapters:
      - name: client_aadt
        tier: D
        licence: client
        notes: Real counts. Also usable to calibrate the proxy on other corridors.
      - name: national_count_programme
        tier: A
        licence: public-domain
        notes: US HPMS, UK DfT count points, NL, DK, AU. Country-specific, free where it exists.
      - name: osm_graph_centrality
        tier: B
        licence: ODbL
        notes: Betweenness on the routable graph. Use graph-tool or networkit, not networkx.

  - name: junction_density
    label: Junction density (per km)
    column: junction_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 95
    missing_behaviour: >
      Conflict-point exposure is lost. Intersections dominate non-exposure risk on
      most corridors, so the geometry terms will absorb part of this effect.
    notes: >
      UNCITED. The HSM models intersections as separate entities with their own SPFs,
      not as a segment-level density, so no HSM CMF transfers. iRAP prices
      intersection type and quality per intersection rather than per km. Sourcing this
      needs a study that prices junction FREQUENCY along a segment.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_graph_nodes
        tier: A
        licence: ODbL
        notes: Nodes of degree >= 3 per km of centreline. Pure graph computation.

  - name: access_density
    label: Access and driveway density (per km)
    column: access_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 90
    weights:
      - value: 0.1658
        family: hsm
        facility_type: rural_two_lane
        region: north_america
        severity: all
        scope: total
        fit_r2: 0.9646
        assumes: { reference_aadt: 10000 }
        source: >
          AASHTO HSM Eq. 10-17 (driveway density), rural two-lane two-way segments;
          derived from Muskaug. Log-linearised against ln1p over 3-20 accesses/km at a
          reference AADT of 10,000, the value in the HSM's own worked example.
          Verified verbatim against the NCHRP draft text for the HSM 2nd edition, and
          checked against that document's own worked example (DD 6 @ AADT 10,000 -> 1.01).
        caveat: >
          The source CMF depends on AADT, which Mode B does not have. The reference
          AADT is an assumption, not a measurement, though the AADT term is weak — it
          enters only as 0.05 - 0.005 x ln(AADT).
    missing_behaviour: >
      Frequently the strongest non-exposure term, and frequently omitted by
      competitors because it is expensive to survey. Free here. Losing it inflates
      junction_density and the roadside activity terms.
    notes: >
      UNITS: accesses per KILOMETRE, counting both sides. The HSM equation is per mile
      and the conversion is already inside the weight — do not convert the column too.
      Known collinearity with ramp_density on the M51 (r = 0.365) — both measure
      access. The VIF gate exists partly for this pair.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_service_driveway
        tier: A
        licence: ODbL
        notes: service=driveway plus minor-road joins per km.

  - name: curve_density
    label: Curve density (curves per km)
    column: curve_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 85
    missing_behaviour: >
      Horizontal alignment leaves the model entirely. Grade alone does not stand in
      for it.
    notes: >
      Fits +0.228 (p = 0.050) on M51 v6 once the composite geometry factor is split
      into components and measured speed enters. The historical negative sign lived in
      the ramp component, never here. Keep this raw — do not re-fuse it.
      UNCITED. HSM Eq. 10-13 and the iRAP curvature factor both price curve SEVERITY
      via radius, not curve FREQUENCY per km. See curve_radius_min for the severity
      term. Sourcing this needs a curve-frequency study.
    adapters:
      - name: client_alignment
        tier: D
        licence: client
      - name: osm_geometry
        tier: A
        licence: ODbL
        notes: Computed from centreline vertices. No external call.

  - name: operating_speed_85
    label: Operating speed, 85th percentile (km/h)
    column: operating_speed_85
    transform: ln
    expected_sign: "+"
    drop_priority: 82
    weights:
      - value: 1.6
        family: elvik
        facility_type: any
        region: global
        severity: injury
        scope: total
        source: >
          Elvik (2009), Power Model, TOI Report 1034/2009 — exponent 1.6 for all
          injury accidents on rural roads and freeways, as reproduced in
          FHWA-HRT-17-098 Chapter 2, Table 1. The Power form N proportional to V^k
          gives beta = k directly under a ln transform, so the weight is exact.
      - value: 4.1
        family: elvik
        facility_type: any
        region: global
        severity: fatal
        scope: total
        source: >
          Elvik (2009), Power Model, TOI Report 1034/2009 — exponent 4.1 for fatal
          accidents on rural roads and freeways, as reproduced in FHWA-HRT-17-098
          Chapter 2, Table 1. Exact under a ln transform.
    missing_behaviour: >
      Falls back to posted speed_limit, which is a materially weaker proxy and carries
      a permanent caveat.
    notes: >
      THE CORRECT HOME FOR THE POWER MODEL. Elvik's exponents relate mean operating
      speed to crashes, so applied here they carry no transfer caveat at all. This is
      why posted and operating speed are separate factors rather than one column with
      an apology attached.
      Measured operating speed is a paid Tier C input. Obtaining it on even one
      corridor is the single highest-value calibration available to Mode B.
    adapters:
      - name: client_speed_survey
        tier: D
        licence: client
      - name: tomtom_free_flow
        tier: C
        licence: proprietary
        notes: Free tier then paid. Speed profiles, never volumes. Opt-in per project.
      - name: here_speed
        tier: C
        licence: proprietary

  - name: speed_limit
    label: Posted speed limit (km/h)
    column: speed_limit
    transform: ln
    expected_sign: "+"
    drop_priority: 80
    weights:
      - value: 1.6
        family: elvik
        facility_type: any
        region: global
        severity: injury
        scope: total
        source: >
          Elvik (2009), Power Model, TOI Report 1034/2009 — exponent 1.6 for all
          injury accidents on rural roads and freeways, as reproduced in
          FHWA-HRT-17-098 Chapter 2, Table 1. Exact under a ln transform.
        caveat: >
          UPPER BOUND. The Power Model relates MEAN OPERATING SPEED to crashes; this
          column is POSTED limit. Posted moves operating speed by materially less than
          1:1, so this overstates the term and inflates it relative to the others.
          Deflating it would require a transfer coefficient nobody has published for
          cross-sectional ranking, so the weight is left intact and the limitation is
          declared instead. Use operating_speed_85 wherever measured speed exists.
      - value: 4.1
        family: elvik
        facility_type: any
        region: global
        severity: fatal
        scope: total
        source: >
          Elvik (2009), Power Model, TOI Report 1034/2009 — exponent 4.1 for fatal
          accidents on rural roads and freeways, as reproduced in FHWA-HRT-17-098
          Chapter 2, Table 1. Exact under a ln transform.
        caveat: >
          UPPER BOUND, same posted-versus-operating limitation as the injury weight.
          Use operating_speed_85 wherever measured speed exists.
    missing_behaviour: >
      The suppressor is lost. On M51, adding speed doubled the curvature coefficient
      rather than shrinking it — without speed, curvature reads weaker than it is.
    notes: >
      This is POSTED, not operating speed. The two are now separate factors so the
      engine cannot conflate them, and the posted weights carry a permanent caveat the
      operating-speed weights do not.
      Posted limit is often constant along a corridor, in which case the variance
      check drops the term before it reaches the model at all.
    adapters:
      - name: client_speed_survey
        tier: D
        licence: client
      - name: osm_maxspeed
        tier: A
        licence: ODbL
        notes: Coverage is patchy and varies sharply by country. Degrade loudly.

  - name: grade_pct
    label: Gradient (absolute %)
    column: grade_pct
    transform: ln1p
    expected_sign: "+"
    drop_priority: 75
    weights:
      - value: 0.1212
        family: hsm
        facility_type: rural_two_lane
        region: north_america
        severity: all
        scope: total
        fit_r2: 1.0
        source: >
          AASHTO HSM Table 10-11 (grades), rural two-lane two-way segments:
          1.00 / 1.10 / 1.16 for <=3%, 3-6%, >6%. Log-linearised against ln1p at band
          midpoints 1.5 / 4.5 / 7.5 percent. Verified verbatim against the NCHRP draft
          text for the HSM 2nd edition.
        caveat: >
          R2 is computed on three points and is not evidence of anything — the source
          table is. The steep band is unbounded above.
      - value: 0.4863
        family: irap
        facility_type: any
        region: global
        severity: all
        scope: run_off_head_on
        fit_r2: 0.7954
        source: >
          iRAP Methodology Reference Guide v3.10, Grade — risk factors 1.0 / 1.2 / 1.7
          for 0-7.5%, 7.5-10%, >=10%, vehicle occupant run-off and
          head-on/loss-of-control crashes. Log-linearised against ln1p at band
          midpoints 3.75 / 8.75 / 11.25 percent. The Guide notes these derive
          primarily from Harwood et al. (2000) for grades up to 8%.
        caveat: >
          The Guide states the >=10% factor reflects extreme gradients and may
          overstate risk at the lower end of that band. Applies to run-off and head-on
          crashes only, not total crashes — which is why the engine will not score a
          like-for-like agreement against the HSM weight. Bands are far wider than the
          HSM's and the resulting weight is four times larger; they are not measuring
          the same thing.
    missing_behaviour: Vertical alignment leaves the model.
    notes: >
      UNITS: ABSOLUTE grade in percent. Neither source distinguishes upgrade from
      downgrade, so neither does the weight.
      THE WORKED EXAMPLE OF WHY SOURCES CARRY SCOPE. HSM says +0.12 for total crashes
      on US rural two-lane roads; iRAP says +0.49 for run-off and head-on crashes
      globally. Both are defensible and they are not in conflict, because they are not
      answering the same question. Averaging them would produce a number neither
      source supports.
    adapters:
      - name: client_survey
        tier: D
        licence: client
      - name: copernicus_dem_glo30
        tier: A
        licence: public-domain
        notes: 30 m resolution. Read as COG over /vsicurl/, never download whole tiles.

  - name: lanes
    label: Lane count
    column: lanes
    transform: ln
    expected_sign: "+"
    drop_priority: 70
    missing_behaviour: Cross-section capacity signal is lost.
    notes: >
      Sign is "+" because exposure here is length x duration, NOT vehicle-kilometres.
      Under that definition lane count acts as a volume proxy. If exposure ever becomes
      AADT-weighted this sign must be revisited — it would likely invert.
      UNCITED. The HSM prices lane WIDTH, not lane COUNT; iRAP likewise. A count weight
      needs a different source.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_lanes
        tier: A
        licence: ODbL

  - name: poi_density
    label: Roadside POI density (per km)
    column: poi_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 65
    missing_behaviour: >
      Roadside activity is under-measured; building_density partially substitutes but
      misses markets, schools and informal stops.
    notes: UNCITED. No standard published weight exists on a comparable scale.
    adapters:
      - name: osm_poi
        tier: A
        licence: ODbL
      - name: overture_places
        tier: A
        licence: ODbL
        notes: Better coverage than OSM in some countries. Use for cross-validation.

  - name: roadside_hazard_score
    label: Roadside hazard score
    column: roadside_hazard_score
    transform: identity
    expected_sign: "+"
    drop_priority: 60
    weights:
      - value: 0.0668
        family: hsm
        facility_type: rural_two_lane
        region: north_america
        severity: all
        scope: total
        source: >
          AASHTO HSM Eq. 10-20 (roadside design), rural two-lane two-way segments; RHR
          scale of Zegeer et al., CMF from Harwood et al. The equation is already
          log-linear — ln(CMF) = 0.0668 x (RHR - 3) — so the weight is exact, with no
          linearisation and no assumptions beyond the scale itself. Verified verbatim
          against the NCHRP draft text for the HSM 2nd edition, and checked against
          that document's own worked example (RHR 4 -> 1.07).
    missing_behaviour: >
      Run-off-road severity drivers are unrepresented. This is the factor iRAP charges
      50-200 USD/km of survey vehicle to obtain.
    notes: >
      UNITS: the HSM roadside hazard rating scale, integer 1 (best) to 7 (worst), base
      condition 3. The weight is meaningless on any other scale — a vision model
      emitting its own 0-1 hazard score MUST be mapped onto RHR first, and that mapping
      is itself a modelling decision that belongs in the report.
      iRAP prices this as two separate attributes (roadside severity object and
      roadside severity distance) rather than one rating. Sourcing an iRAP weight here
      needs the Methodology Reference Guide.
      Mapillary is CC-BY-SA — share-alike applies to a redistributed derived database,
      not to a report with attribution. Never use Google Street View for this; the Maps
      Platform ToS forbids deriving a dataset from it.
    adapters:
      - name: client_survey
        tier: D
        licence: client
      - name: mapillary_detections
        tier: B
        licence: CC-BY-SA
        notes: Already-extracted detections. Try these before running any inference.
      - name: mapillary_vision
        tier: B
        licence: CC-BY-SA
        notes: >
          Own inference on sampled frames only. VLM-per-image on a full corridor is
          50-150 USD and is the main cost trap in the pipeline.

  - name: curve_radius_min
    label: Minimum curve radius (m)
    column: curve_radius_min
    transform: ln
    expected_sign: "-"
    drop_priority: 55
    weights:
      - value: -0.1855
        family: hsm
        facility_type: rural_two_lane
        region: north_america
        severity: all
        scope: total
        fit_r2: 0.8784
        assumes: { segment_length_km: 0.5 }
        source: >
          AASHTO HSM Eq. 10-13 (horizontal curves), rural two-lane two-way segments;
          regression model of Zegeer et al. Log-linearised against ln over radii
          50-1600 m, assuming a 0.5 km segment fully in curve with no spiral
          transition. Verified verbatim against the NCHRP draft text for the HSM 2nd
          edition, and checked against that document's own worked example
          (0.1 mi / 1200 ft -> 1.43).
        caveat: >
          Weakest linearisation in the registry at R2 0.878 — a 1 + c/R relationship is
          only roughly log-linear, so this under-weights very tight curves. The weight
          is also tied to the segmentation length, which the engine checks against the
          actual run.
      - value: -0.7232
        family: irap
        facility_type: any
        region: global
        severity: all
        scope: run_off_head_on
        fit_r2: 0.9378
        source: >
          iRAP Methodology Reference Guide v3.10, Curvature — risk factors
          1.0 / 1.8 / 3.5 / 6.0 for the categories straight-or-gently-curving,
          moderate, sharp and very sharp, which the Guide maps to radius ranges
          >900 m, 500-900 m, 200-500 m and 0-200 m. Vehicle occupant run-off and
          head-on/loss-of-control crashes. Log-linearised against ln at band midpoints
          1100 / 700 / 350 / 100 m.
        caveat: >
          Motorcyclist factors are ~10% higher than the vehicle-occupant values used
          here, so a corridor with a large motorcycle share is under-weighted. Scope is
          run-off and head-on, not total crashes.
    missing_behaviour: Curve severity is lost; curve_density still carries frequency.
    notes: >
      UNITS: minimum radius in METRES. The HSM equation is in feet; the conversion is
      inside the weight.
      The `assumes` block is load-bearing: HSM Eq. 10-13 depends on curve length, so
      the 0.5 km assumption is baked into the number. The engine warns when the actual
      segmentation differs by more than 25%, and the weight should be regenerated for
      that segmentation.
      Adapter must cap radius on tangent sections — a straight has infinite radius and
      ln() will reject it, by design.
      Expect collinearity with curve_density; the VIF gate resolves which survives.
    adapters:
      - name: client_alignment
        tier: D
        licence: client
      - name: osm_geometry
        tier: A
        licence: ODbL

  - name: ramp_density
    label: Ramp and interchange density (per km)
    column: ramp_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 50
    missing_behaviour: Merge and diverge conflict is unrepresented.
    notes: >
      OPEN BLOCKER, DELIBERATELY UNCITED. On M51 this term inverts: +0.316 alone,
      -0.327 alongside the roadside activity factor (p = 0.012, r = 0.365). Both
      measure access. It is not diagnosable on M51 — both are region-constant across
      7 units, so the effective sample size is 7, not 1,085.
      Sourcing a weight before the sign is understood would be premature and would
      lend false confidence to a term we know behaves badly. It stays uncited until a
      second corridor where access density and ramp density separate.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_link_ways
        tier: A
        licence: ODbL
        notes: highway=*_link per km.

  - name: lit
    label: Lit proportion of segment
    column: lit
    transform: identity
    expected_sign: "-"
    drop_priority: 45
    weights:
      - value: -0.0817
        family: hsm
        facility_type: rural_two_lane
        region: north_america
        severity: all
        scope: total
        source: >
          AASHTO HSM Eq. 10-21 (lighting) with Table 10-12 defaults for roadway type 2U
          (p_inr = 0.382, p_pnr = 0.618, p_nr = 0.370); underlying research Elvik and
          Vaa. A fully lit segment gives CMF = 0.9216, so the weight is ln(0.9216),
          exact. Verified verbatim against the NCHRP draft text for the HSM 2nd edition.
        caveat: >
          Table 10-12 night-crash proportions are Washington State HSIS data 2002-2006.
          Night-crash share varies enormously by country; replacing these with local
          proportions is a cheap, high-value calibration.
      - value: -0.1398
        family: irap
        facility_type: any
        region: global
        severity: all
        scope: intersection
        source: >
          iRAP Methodology Reference Guide v3.10, Street lighting — present 1.00 versus
          not-present 1.15 for vehicle occupants at intersections. Risk factors updated
          in the v3.10 model. Weight is ln(1.00) - ln(1.15) over a proportion moving
          0 to 1, exact.
        caveat: >
          Scope is INTERSECTION crashes for vehicle occupants, not total segment
          crashes, so this is much narrower than the HSM lighting weight and the two
          are not comparable. Pedestrian and bicyclist factors are higher (1.25); a
          corridor with heavy pedestrian activity is under-weighted by this term.
    missing_behaviour: >
      Night risk is carried entirely by night_ratio, which cannot distinguish a lit
      corridor from an unlit one.
    notes: >
      UNITS: proportion of the segment that is lit, 0 to 1. The weight scales linearly
      between unlit and fully lit.
      OSM `lit` is badly under-tagged in most of the target market. Cross-validate
      against VIIRS night lights and report the disagreement rather than assuming the
      absent tag means unlit.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_lit
        tier: A
        licence: ODbL
      - name: viirs_night_lights
        tier: A
        licence: public-domain
        notes: NOAA. A proxy for lighting presence, and the cross-check on OSM `lit`.

  - name: population_density
    label: Population density (persons per km2)
    column: population_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 40
    missing_behaviour: Urban/rural context is weakened; land use must carry it alone.
    notes: UNCITED. No standard published weight exists on a comparable scale.
    adapters:
      - name: ghsl
        tier: A
        licence: public-domain
        notes: EU JRC Global Human Settlement Layer.
      - name: worldpop
        tier: A
        licence: public-domain

  - name: roadside_object_density
    label: Roadside fixed-object density (per km)
    column: roadside_object_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 35
    missing_behaviour: >
      Fixed-object strike risk is folded into roadside_hazard_score, losing the
      distinction between "many poles" and "steep side slope".
    notes: >
      UNCITED. iRAP's roadside severity attributes price the nearest object and its
      distance rather than object density per km; sourcing this needs the Methodology
      Reference Guide and a mapping decision.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: mapillary_detections
        tier: B
        licence: CC-BY-SA
        notes: Poles, trees, walls. Pre-extracted — no inference cost.

  - name: building_density
    label: Building density (per km)
    column: building_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 30
    missing_behaviour: Roadside development intensity is lost.
    notes: UNCITED. No standard published weight exists on a comparable scale.
    adapters:
      - name: ms_global_buildings
        tier: A
        licence: ODbL
        notes: Microsoft Global ML Building Footprints.

  - name: sight_distance_proxy
    label: Sight distance proxy (m)
    column: sight_distance_proxy
    transform: ln
    expected_sign: "-"
    drop_priority: 25
    missing_behaviour: Visibility constraint is unrepresented.
    notes: >
      DEM viewshed along the alignment. Crude — it sees terrain, not vegetation, walls
      or parked vehicles. Report as a proxy, never as measured sight distance.
      UNCITED. iRAP prices sight distance as a likelihood attribute; sourcing needs the
      Methodology Reference Guide.
    adapters:
      - name: client_survey
        tier: D
        licence: client
      - name: dem_viewshed
        tier: B
        licence: public-domain

  - name: median_present
    label: Median present (0/1)
    column: median_present
    transform: identity
    expected_sign: "-"
    drop_priority: 20
    missing_behaviour: Head-on separation is unrepresented.
    notes: >
      UNCITED, and the best next candidate. HSM Chapter 11 (rural multilane) carries
      divided versus undivided SPFs, and iRAP prices median type directly. Both are
      ordinary literature work.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_divided
        tier: A
        licence: ODbL
        notes: Dual carriageway pairs and `divider` tags. Partial coverage.

  - name: night_ratio
    label: Night share of exposure
    column: night_ratio
    transform: identity
    expected_sign: "+"
    drop_priority: 15
    missing_behaviour: >
      Temporal risk variation is lost. Only matters when the panel resolves time slots;
      on a period-only panel this factor is constant and will be dropped by the
      variance check regardless.
    notes: UNCITED. Derived from the panel's own time-slot definition, not fetched.
    adapters:
      - name: panel_construction
        tier: A
        licence: client
        notes: Derived from the time-slot definition. Never fetched.

  - name: surface_paved
    label: Paved proportion of segment
    column: surface_paved
    transform: identity
    expected_sign: "-"
    drop_priority: 10
    weights:
      - value: -1.0986
        family: irap
        facility_type: any
        region: global
        severity: all
        scope: total
        source: >
          iRAP Methodology Reference Guide v3.10, Skid resistance —
          sealed-adequate 1.0 versus unsealed-adequate 3.0 for vehicle occupants,
          across run-off, head-on/loss-of-control, head-on/overtaking and intersection
          crashes. Weight is ln(1.0) - ln(3.0) over a proportion moving 0 to 1, exact.
        caveat: >
          The largest weight in the registry after speed, and it should be: iRAP prices
          an unsealed road at three times the risk of a sealed one. Covers vehicle
          occupants only, not pedestrian crashes. Motorcyclist factors are higher again
          (4.0 unsealed), so a high-motorcycle corridor is under-weighted.
    missing_behaviour: Surface quality is unrepresented.
    notes: >
      UNITS: proportion of the segment that is sealed, 0 to 1.
      Paved/unpaved only — this is NOT a condition index. The weight holds surface
      quality at "adequate" on both sides to isolate the sealed/unsealed effect from
      the condition effect, which this registry does not model separately. iRAP prices
      condition (good/medium/poor, 1.0/1.2/1.4) as a distinct attribute; adding it
      would need a new factor and a column to feed it.
      Skid resistance, IRI and rutting remain Tier D and priced per km.
      OSM `surface` suffers tag rot; the Mapillary cross-check disagrees often enough
      to be worth reporting.
    adapters:
      - name: client_survey
        tier: D
        licence: client
      - name: osm_surface
        tier: A
        licence: ODbL
      - name: mapillary_vision
        tier: B
        licence: CC-BY-SA
        notes: Cross-validation on OSM `surface`. Disagreement means tag rot.

  - name: sidewalk_present
    label: Footway present (0/1)
    column: sidewalk_present
    transform: identity
    expected_sign: "-"
    drop_priority: 5
    missing_behaviour: >
      Pedestrian protection is unrepresented. Material where vulnerable road users are
      a large share of casualties, which is most of the target market.
    notes: >
      UNCITED. FHWA pedestrian CMFs exist but apply to pedestrian crashes specifically,
      not total crashes, and iRAP prices footpath provision within its pedestrian Star
      Rating. Both would enter with scope `pedestrian`, which needs a severity-aware
      index before the weight is meaningful.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_sidewalk
        tier: A
        licence: ODbL
