# Factor registry
#
# A factor is a declaration, not code. Adding one here is the only step required to
# make it available to both modes. The engine reads this file and builds the model
# specification from it.
#
# ---------------------------------------------------------------------------------
# ON default_weight
#
# Mode B applies published weights and must cite each one; an uncited weight is a
# liability. The engine REFUSES to run Mode B until both `default_weight` and
# `weight_source` are present, so a factor with no citation simply does not
# participate — it is never silently given a weight of zero or one.
#
# Six factors are currently sourced, all from the AASHTO Highway Safety Manual or
# the Elvik Power Model. Every one of those weights is COMPUTED, not chosen: run
#
#     python tools/derive_weights.py
#
# to regenerate them from the published equations. Full working, including each
# equation verbatim and every assumption made to convert a CMF into a log-scale
# weight, is in docs/WEIGHTS.md.
#
# THE TRANSFER PROBLEM: every HSM weight below was estimated on US rural two-lane
# two-way highways. Applying them to Lebanon, MENA or South Asia is an
# extrapolation and is the largest source of error in Mode B. It is defensible only
# because Mode B is an ordinal RANKING — a common scaling error moves every unit
# together and leaves the order intact. It would not be defensible for a predicted
# count, which is one reason the engine refuses to emit one.
#
# The remaining factors stay unsourced until a citable weight exists for each.
# Mode A is unaffected throughout — it estimates its own coefficients.
# ---------------------------------------------------------------------------------
#
# ON expected_sign
#
# The guard rail. A fitted coefficient that contradicts its declared sign is flagged
# prominently and never quietly reported. Signs here are derived from mechanism, not
# from a fit, so they are defensible independently of any dataset.
# ---------------------------------------------------------------------------------
#
# DELIBERATELY ABSENT: rainfall and other weather terms. Withdrawn from the M51 model
# as a season artefact. A variable that correlates with an omitted seasonal cycle is
# not measuring what its name claims. It returns only alongside an explicit seasonal
# control.
# ---------------------------------------------------------------------------------
#
# drop_priority: lower is shed first when the ladder must reduce the specification.
# Values are unique so descent is deterministic.

version: "0.1.0"

factors:
  - name: traffic_proxy
    label: Traffic proxy (graph centrality)
    column: traffic_proxy
    transform: ln1p
    expected_sign: "+"
    drop_priority: 100
    default_weight: null
    weight_source: null
    missing_behaviour: >
      Exposure reverts to length x duration alone. The model can no longer separate
      "busy" from "long", and every other coefficient absorbs some volume signal.
      The single most damaging absence in the registry.
    notes: >
      NEVER relabel this as `aadt`. No global open AADT source exists. This is a
      relative ranking quantity built from road class, population accessibility,
      graph centrality and night lights. Where the client supplies real counts the
      client adapter wins and the value becomes a measured AADT — at which point the
      column, and the report, say so.
    adapters:
      - name: client_aadt
        tier: D
        licence: client
        notes: Real counts. Also usable to calibrate the proxy on other corridors.
      - name: national_count_programme
        tier: A
        licence: public-domain
        notes: US HPMS, UK DfT count points, NL, DK, AU. Country-specific, free where it exists.
      - name: osm_graph_centrality
        tier: B
        licence: ODbL
        notes: Betweenness on the routable graph. Use graph-tool or networkit, not networkx.

  - name: junction_density
    label: Junction density (per km)
    column: junction_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 95
    default_weight: null
    weight_source: null
    missing_behaviour: >
      Conflict-point exposure is lost. Intersections dominate non-exposure risk on
      most corridors, so the geometry terms will absorb part of this effect.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_graph_nodes
        tier: A
        licence: ODbL
        notes: Nodes of degree >= 3 per km of centreline. Pure graph computation.

  - name: access_density
    label: Access and driveway density (per km)
    column: access_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 90
    default_weight: 0.1658
    weight_source: >
      AASHTO HSM Eq. 10-17 (driveway density, rural two-lane two-way segments;
      derived from Muskaug). Log-linearised against ln1p over 3-20 accesses/km at a
      reference AADT of 10,000 — the value used in the HSM's own worked example.
      R2 = 0.965. Working: tools/derive_weights.py, docs/WEIGHTS.md.
    missing_behaviour: >
      Frequently the strongest non-exposure term, and frequently omitted by
      competitors because it is expensive to survey. Free here. Losing it inflates
      junction_density and the roadside activity terms.
    notes: >
      UNITS: accesses per KILOMETRE, counting both sides. The HSM equation is per
      mile and the conversion is already inside the derived weight — do not convert
      the column as well.
      The source CMF depends on AADT, which Mode B does not have; the reference
      value above is an assumption, not a measurement. The AADT term is weak, since
      it enters only as 0.05 - 0.005 x ln(AADT).
      Known collinearity with ramp_density on the M51 (r = 0.365) — both measure
      access. The VIF gate exists partly for this pair.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_service_driveway
        tier: A
        licence: ODbL
        notes: service=driveway plus minor-road joins per km.

  - name: curve_density
    label: Curve density (curves per km)
    column: curve_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 85
    default_weight: null
    weight_source: null
    missing_behaviour: >
      Horizontal alignment leaves the model entirely. Grade alone does not stand in
      for it.
    notes: >
      Fits +0.228 (p = 0.050) on M51 v6 once the composite geometry factor is split
      into components and measured speed enters. The historical negative sign lived
      in the ramp component, never here. Keep this raw — do not re-fuse it into a
      composite.
    adapters:
      - name: client_alignment
        tier: D
        licence: client
      - name: osm_geometry
        tier: A
        licence: ODbL
        notes: Computed from centreline vertices. No external call.

  - name: speed_limit
    label: Posted speed limit (km/h)
    column: speed_limit
    transform: ln
    expected_sign: "+"
    drop_priority: 80
    default_weight: 1.6
    weight_source: >
      Elvik (2009), Power Model, TOI Report 1034/2009 — exponent 1.6 for all injury
      accidents on rural roads and freeways, as reproduced in FHWA-HRT-17-098
      Chapter 2, Table 1. The Power form N ∝ V^k gives beta = k directly under a ln
      transform, so this weight is exact rather than fitted.
      Working: tools/derive_weights.py, docs/WEIGHTS.md.
    missing_behaviour: >
      The suppressor is lost. On M51, adding speed doubled the curvature coefficient
      rather than shrinking it — without speed, curvature reads weaker than it is.
    notes: >
      WEIGHT IS AN UPPER BOUND. The Power Model relates MEAN OPERATING SPEED to
      crashes; this column is POSTED limit. Posted moves operating speed by
      materially less than 1:1, so 1.6 overstates this term and inflates it relative
      to the other five. It is the largest and least certain weight in the registry.
      Recalibrate against measured operating speed (Tier C) at the first opportunity.
      If a panel counts FATAL crashes rather than injury crashes the exponent is 4.1,
      not 1.6 — the weight is severity-specific and the registry currently assumes
      injury crashes.
      Posted limit is also often constant along a corridor, in which case the
      variance check drops it before it reaches the model at all.
    adapters:
      - name: client_speed_survey
        tier: D
        licence: client
      - name: osm_maxspeed
        tier: A
        licence: ODbL
        notes: Coverage is patchy and varies sharply by country. Degrade loudly.

  - name: grade_pct
    label: Gradient (absolute %)
    column: grade_pct
    transform: ln1p
    expected_sign: "+"
    drop_priority: 75
    default_weight: 0.1212
    weight_source: >
      AASHTO HSM Table 10-11 (grades, rural two-lane two-way segments): CMF 1.00 /
      1.10 / 1.16 for <=3%, 3-6%, >6%. Log-linearised against ln1p using band
      midpoints 1.5 / 4.5 / 7.5 percent. R2 = 1.000, but on three points only — the
      fit statistic is not evidence here, the source table is.
      Working: tools/derive_weights.py, docs/WEIGHTS.md.
    missing_behaviour: Vertical alignment leaves the model.
    notes: >
      UNITS: ABSOLUTE grade in percent. HSM Table 10-11 does not distinguish
      upgrade from downgrade, so neither does this weight.
      The steep band is unbounded above and 7.5% was chosen to represent it; a
      corridor with sustained grades well above 8% is under-weighted by this term.
    adapters:
      - name: client_survey
        tier: D
        licence: client
      - name: copernicus_dem_glo30
        tier: A
        licence: public-domain
        notes: 30 m resolution. Read as COG over /vsicurl/, never download whole tiles.

  - name: lanes
    label: Lane count
    column: lanes
    transform: ln
    expected_sign: "+"
    drop_priority: 70
    default_weight: null
    weight_source: null
    missing_behaviour: Cross-section capacity signal is lost.
    notes: >
      Sign is "+" because exposure here is length x duration, NOT vehicle-kilometres.
      Under that definition lane count acts as a volume proxy, and more lanes carry
      more vehicles past the same point. If exposure ever becomes AADT-weighted this
      sign must be revisited — it would likely invert. Flagged so the reversal is
      not mistaken for a finding.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_lanes
        tier: A
        licence: ODbL

  - name: poi_density
    label: Roadside POI density (per km)
    column: poi_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 65
    default_weight: null
    weight_source: null
    missing_behaviour: >
      Roadside activity is under-measured; building_density partially substitutes but
      misses markets, schools and informal stops.
    adapters:
      - name: osm_poi
        tier: A
        licence: ODbL
      - name: overture_places
        tier: A
        licence: ODbL
        notes: Better coverage than OSM in some countries. Use for cross-validation.

  - name: roadside_hazard_score
    label: Roadside hazard score
    column: roadside_hazard_score
    transform: identity
    expected_sign: "+"
    drop_priority: 60
    default_weight: 0.0668
    weight_source: >
      AASHTO HSM Eq. 10-20 (roadside design, rural two-lane two-way segments; RHR
      scale of Zegeer et al., CMF from Harwood et al.). The equation is already
      log-linear — ln(CMF) = 0.0668 x (RHR - 3) — so the weight is exact, with no
      linearisation and no assumptions beyond the scale itself. The cleanest weight
      in the registry. Working: tools/derive_weights.py, docs/WEIGHTS.md.
    missing_behaviour: >
      Run-off-road severity drivers are unrepresented. This is the factor iRAP
      charges 50-200 USD/km of survey vehicle to obtain.
    notes: >
      UNITS: the HSM roadside hazard rating scale, integer 1 (best) to 7 (worst),
      base condition 3. The weight is meaningless on any other scale — a vision
      model emitting its own 0-1 hazard score MUST be mapped onto RHR first, and
      that mapping is itself a modelling decision that belongs in the report.
      Derived from street-level imagery. Mapillary is CC-BY-SA — share-alike applies
      to a redistributed derived database, not to a report with attribution. Never
      use Google Street View for this; the Maps Platform ToS forbids deriving a
      dataset from it, and that is a real liability on a paid deliverable.
    adapters:
      - name: client_survey
        tier: D
        licence: client
      - name: mapillary_detections
        tier: B
        licence: CC-BY-SA
        notes: Already-extracted detections. Try these before running any inference.
      - name: mapillary_vision
        tier: B
        licence: CC-BY-SA
        notes: >
          Own inference on sampled frames only. VLM-per-image on a full corridor is
          50-150 USD and is the main cost trap in the pipeline.

  - name: curve_radius_min
    label: Minimum curve radius (m)
    column: curve_radius_min
    transform: ln
    expected_sign: "-"
    drop_priority: 55
    default_weight: -0.1855
    weight_source: >
      AASHTO HSM Eq. 10-13 (horizontal curves, rural two-lane two-way segments;
      regression model of Zegeer et al.). Log-linearised against ln over radii of
      50-1600 m, assuming a 0.5 km segment fully in curve with no spiral transition.
      R2 = 0.878 — the weakest fit of the six, because a 1 + c/R relationship is only
      roughly log-linear. Working: tools/derive_weights.py, docs/WEIGHTS.md.
    missing_behaviour: Curve severity is lost; curve_density still carries frequency.
    notes: >
      UNITS: minimum radius in METRES. The HSM equation is in feet; the conversion
      is already inside the derived weight.
      THIS WEIGHT IS TIED TO THE SEGMENTATION LENGTH. HSM Eq. 10-13 depends on curve
      length, so the 0.5 km assumption is baked in. Change the segmentation and this
      weight must be regenerated.
      Adapter must cap radius on tangent sections — a straight has infinite radius
      and ln() will reject it. Cap at the corridor design maximum, and record the cap
      in the run log so the ceiling is visible in the report.
      Expect collinearity with curve_density; the VIF gate resolves which survives.
    adapters:
      - name: client_alignment
        tier: D
        licence: client
      - name: osm_geometry
        tier: A
        licence: ODbL

  - name: ramp_density
    label: Ramp and interchange density (per km)
    column: ramp_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 50
    default_weight: null
    weight_source: null
    missing_behaviour: Merge and diverge conflict is unrepresented.
    notes: >
      OPEN BLOCKER. On M51 this term inverts: +0.316 alone, -0.327 alongside the
      roadside activity factor (p = 0.012, r = 0.365). Both measure access. It is not
      diagnosable on M51 — both are region-constant across 7 units, so the effective
      sample size is 7, not 1,085. Resolving it requires a second corridor where
      access density and ramp density separate. Until then, treat any fitted value
      for this term as unresolved and say so in the report.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_link_ways
        tier: A
        licence: ODbL
        notes: highway=*_link per km.

  - name: lit
    label: Lit proportion of segment
    column: lit
    transform: identity
    expected_sign: "-"
    drop_priority: 45
    default_weight: -0.0817
    weight_source: >
      AASHTO HSM Eq. 10-21 (lighting) with Table 10-12 defaults for roadway type 2U
      (p_inr = 0.382, p_pnr = 0.618, p_nr = 0.370); underlying research Elvik and
      Vaa. A fully lit segment gives CMF = 0.9216, so the weight is ln(0.9216),
      exact. Working: tools/derive_weights.py, docs/WEIGHTS.md.
    missing_behaviour: >
      Night risk is carried entirely by night_ratio, which cannot distinguish a lit
      corridor from an unlit one.
    notes: >
      UNITS: proportion of the segment that is lit, 0 to 1. The weight scales
      linearly between unlit and fully lit.
      HSM Table 10-12 night-crash proportions are Washington State HSIS data
      2002-2006. Night-crash share varies enormously by country and these should be
      replaced with local proportions wherever they exist — this is a cheap and
      high-value local calibration.
      OSM `lit` is badly under-tagged in most of the target market. Cross-validate
      against VIIRS night lights and report the disagreement rather than assuming the
      absent tag means unlit.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_lit
        tier: A
        licence: ODbL
      - name: viirs_night_lights
        tier: A
        licence: public-domain
        notes: NOAA. A proxy for lighting presence, and the cross-check on OSM `lit`.

  - name: population_density
    label: Population density (persons per km2)
    column: population_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 40
    default_weight: null
    weight_source: null
    missing_behaviour: Urban/rural context is weakened; land use must carry it alone.
    adapters:
      - name: ghsl
        tier: A
        licence: public-domain
        notes: EU JRC Global Human Settlement Layer.
      - name: worldpop
        tier: A
        licence: public-domain

  - name: roadside_object_density
    label: Roadside fixed-object density (per km)
    column: roadside_object_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 35
    default_weight: null
    weight_source: null
    missing_behaviour: >
      Fixed-object strike risk is folded into roadside_hazard_score, losing the
      distinction between "many poles" and "steep side slope".
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: mapillary_detections
        tier: B
        licence: CC-BY-SA
        notes: Poles, trees, walls. Pre-extracted — no inference cost.

  - name: building_density
    label: Building density (per km)
    column: building_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 30
    default_weight: null
    weight_source: null
    missing_behaviour: Roadside development intensity is lost.
    adapters:
      - name: ms_global_buildings
        tier: A
        licence: ODbL
        notes: Microsoft Global ML Building Footprints.

  - name: sight_distance_proxy
    label: Sight distance proxy (m)
    column: sight_distance_proxy
    transform: ln
    expected_sign: "-"
    drop_priority: 25
    default_weight: null
    weight_source: null
    missing_behaviour: Visibility constraint is unrepresented.
    notes: >
      DEM viewshed along the alignment. Crude — it sees terrain, not vegetation,
      walls or parked vehicles. Report it as a proxy and never as measured sight
      distance.
    adapters:
      - name: client_survey
        tier: D
        licence: client
      - name: dem_viewshed
        tier: B
        licence: public-domain

  - name: median_present
    label: Median present (0/1)
    column: median_present
    transform: identity
    expected_sign: "-"
    drop_priority: 20
    default_weight: null
    weight_source: null
    missing_behaviour: Head-on separation is unrepresented.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_divided
        tier: A
        licence: ODbL
        notes: Dual carriageway pairs and `divider` tags. Partial coverage.

  - name: night_ratio
    label: Night share of exposure
    column: night_ratio
    transform: identity
    expected_sign: "+"
    drop_priority: 15
    default_weight: null
    weight_source: null
    missing_behaviour: >
      Temporal risk variation is lost. Only matters when the panel resolves time
      slots; on a period-only panel this factor is constant and will be dropped by
      the variance check regardless.
    adapters:
      - name: panel_construction
        tier: A
        licence: client
        notes: Derived from the time-slot definition. Never fetched.

  - name: surface_paved
    label: Paved proportion of segment
    column: surface_paved
    transform: identity
    expected_sign: "-"
    drop_priority: 10
    default_weight: null
    weight_source: null
    missing_behaviour: Surface quality is unrepresented.
    notes: >
      Paved/unpaved only — this is not a condition index. Skid resistance, IRI and
      rutting are all Tier D and priced per km. OSM `surface` suffers tag rot; the
      Mapillary cross-check disagrees often enough to be worth reporting.
    adapters:
      - name: client_survey
        tier: D
        licence: client
      - name: osm_surface
        tier: A
        licence: ODbL
      - name: mapillary_vision
        tier: B
        licence: CC-BY-SA
        notes: Cross-validation on OSM `surface`. Disagreement means tag rot.

  - name: sidewalk_present
    label: Footway present (0/1)
    column: sidewalk_present
    transform: identity
    expected_sign: "-"
    drop_priority: 5
    default_weight: null
    weight_source: null
    missing_behaviour: >
      Pedestrian protection is unrepresented. Material where vulnerable road users
      are a large share of casualties, which is most of the target market.
    adapters:
      - name: client_inventory
        tier: D
        licence: client
      - name: osm_sidewalk
        tier: A
        licence: ODbL
