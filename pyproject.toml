[project]
name = "roadrisk-panel"
version = "0.1.0"
description = "Modular road risk assessment panel — corridor risk from open data, with provenance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# The geospatial pipeline. Deliberately NOT a core dependency: `roadrisk.core` must
# stay installable and runnable with nothing but pandas/statsmodels, so the method
# remains testable independently of the machinery that feeds it.
geo = [
    "shapely>=2.0",
    "pyproj>=3.6",
]
# The DEM and land-cover adapters, and only those. rasterio bundles GDAL, which is by
# far the heaviest thing this package can depend on, and the nine OSM factors plus the
# whole engine run without it. Every raster adapter takes an injectable sampler, so the
# test suite does not need this either.
raster = [
    "rasterio>=1.3",
]
# The Bayesian rung's MCMC fallback, and only that. The shipped path — Laplace with an
# importance check — runs on numpy and scipy alone, so this is needed exactly when the
# approximation is refused and the ladder has to descend. emcee is pure Python, which
# is deliberate: this package must stay installable where compiled extensions cannot
# load, and a machine security policy blocking one binary should not cost a whole rung.
bayes = [
    "emcee>=3.1",
]
# Postgres persistence, and only that. A corridor fits in memory and the CLI is
# single-user, so nothing in the assessment path needs a database — this exists for the
# web layer, where runs have to outlive the process that made them. `MemoryStore`
# implements the same protocol with no dependency at all, and the conformance suite runs
# against both, so the test suite does not need a server either.
store = [
    "psycopg[binary]>=3.2",
]
# The HTTP layer, and only that. The engine, the report and the assessment half of the
# CLI run without it — `roadrisk assess` and `roadrisk corridor` never import fastapi,
# so a machine that only needs an assessment does not install a web framework to get
# one. Deliberately does NOT pull in `store`: the API runs on `MemoryStore` with no
# database, which is a real service that forgets everything when it stops and is the
# right shape for trying it before committing to Postgres.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# Jobs that outlive the process which accepted them. Its own extra because the API is
# usable without it — `roadrisk serve` runs jobs in a bounded pool inside itself, which
# is right for one machine — and because a deployment that only serves stored runs
# should not have to install a queue to do it. Celery needs a broker; this package
# ships none and refuses to guess at one, so $ROADRISK_BROKER_URL has no default.
worker = [
    "celery>=5.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Starlette's TestClient speaks to the app in-process over httpx, so the API suite
    # needs no server and no port.
    "httpx>=0.27",
    "roadrisk-panel[geo]",
    "roadrisk-panel[bayes]",
    "roadrisk-panel[store]",
    "roadrisk-panel[api]",
]

[project.scripts]
roadrisk = "roadrisk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
