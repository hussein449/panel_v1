[project]
name = "roadrisk-panel"
version = "0.1.0"
description = "Modular road risk assessment panel — corridor risk from open data, with provenance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# The geospatial pipeline. Deliberately NOT a core dependency: `roadrisk.core` must
# stay installable and runnable with nothing but pandas/statsmodels, so the method
# remains testable independently of the machinery that feeds it.
geo = [
    "shapely>=2.0",
    "pyproj>=3.6",
]
# The DEM and land-cover adapters, and only those. rasterio bundles GDAL, which is by
# far the heaviest thing this package can depend on, and the nine OSM factors plus the
# whole engine run without it. Every raster adapter takes an injectable sampler, so the
# test suite does not need this either.
raster = [
    "rasterio>=1.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "roadrisk-panel[geo]",
]

[project.scripts]
roadrisk = "roadrisk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
