# TEST FIXTURE ONLY — DO NOT USE FOR AN ASSESSMENT.
#
# The weights below are invented so that Mode B can be exercised deterministically,
# independently of whatever the shipped registry currently cites. They carry a
# `source` that says exactly that, which is the point: the engine's rule is "no weight
# without a citation", not "no weight without a *good* citation".
#
# `curve_density` deliberately carries two weights from different families with the
# same scope, so agreement scoring has something to compare. `grade_pct` carries two
# with DIFFERENT scopes, so the not-comparable path is exercised too.

version: "test-sourced-0.2.0"

factors:
  - name: curve_density
    label: Curve density (curves per km)
    column: curve_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 85
    weights:
      - value: 0.25
        family: irap
        facility_type: any
        region: global
        severity: all
        scope: total
        source: "SYNTHETIC — test fixture, not a real citation"
      - value: 0.20
        family: hsm
        facility_type: rural_two_lane
        region: north_america
        severity: all
        scope: total
        source: "SYNTHETIC — test fixture, not a real citation"
    missing_behaviour: Horizontal alignment leaves the model.
    adapters:
      - name: osm_geometry
        tier: A
        licence: ODbL

  - name: junction_density
    label: Junction density (per km)
    column: junction_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 95
    weights:
      - value: 0.30
        family: irap
        source: "SYNTHETIC — test fixture, not a real citation"
    missing_behaviour: Conflict-point exposure is lost.
    adapters:
      - name: osm_graph_nodes
        tier: A
        licence: ODbL

  - name: access_density
    label: Access and driveway density (per km)
    column: access_density
    transform: ln1p
    expected_sign: "+"
    drop_priority: 90
    weights:
      - value: 0.20
        family: hsm
        facility_type: rural_two_lane
        region: north_america
        source: "SYNTHETIC — test fixture, not a real citation"
    missing_behaviour: Access conflict is lost.
    adapters:
      - name: osm_service_driveway
        tier: A
        licence: ODbL

  - name: grade_pct
    label: Gradient (absolute %)
    column: grade_pct
    transform: ln1p
    expected_sign: "+"
    drop_priority: 75
    weights:
      - value: 0.12
        family: hsm
        scope: total
        source: "SYNTHETIC — test fixture, not a real citation"
      - value: 0.48
        family: irap
        scope: run_off_head_on
        source: "SYNTHETIC — test fixture, not a real citation"
    missing_behaviour: Vertical alignment leaves the model.
    adapters:
      - name: copernicus_dem_glo30
        tier: A
        licence: public-domain

  - name: speed_limit
    label: Posted speed limit (km/h)
    column: speed_limit
    transform: ln
    expected_sign: "+"
    drop_priority: 80
    weights:
      - value: 0.90
        family: elvik
        severity: injury
        source: "SYNTHETIC — test fixture, not a real citation"
    missing_behaviour: The speed suppressor is lost.
    adapters:
      - name: osm_maxspeed
        tier: A
        licence: ODbL

  - name: lit
    label: Lit proportion of segment
    column: lit
    transform: identity
    expected_sign: "-"
    drop_priority: 45
    weights:
      - value: -0.25
        family: hsm
        source: "SYNTHETIC — test fixture, not a real citation"
    missing_behaviour: Night risk carried by night_ratio alone.
    adapters:
      - name: osm_lit
        tier: A
        licence: ODbL
